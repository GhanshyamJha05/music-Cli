name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Windows
        run: go build -ldflags="-s -w" -o music-Cli-windows.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-Cli-windows.exe
          path: music-Cli-windows.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build macOS
        run: go build -ldflags="-s -w" -o music-Cli-macos .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-Cli-macos
          path: music-Cli-macos

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Linux
        run: go build -ldflags="-s -w" -o music-Cli-linux .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-Cli-linux
          path: music-Cli-linux

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            music-Cli-windows.exe/music-Cli-windows.exe
            music-Cli-macos/music-Cli-macos
            music-Cli-linux/music-Cli-linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
