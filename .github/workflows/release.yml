name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Windows Executables
        run: |
          go build -ldflags="-s -w" -o music.exe .
          Copy-Item music.exe music-Cli-windows.exe

      - name: Download Portable yt-dlp & ffmpeg for bundle
        shell: pwsh
        run: |
          Write-Host "Downloading yt-dlp..."
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "yt-dlp.exe"
          Write-Host "Downloading ffmpeg essentials..."
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          $ffmpegExe = Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination "ffmpeg.exe"
          Get-Item music.exe, yt-dlp.exe, ffmpeg.exe | Select-Object Name, Length

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer.iss

      - name: Upload Windows Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: music-cli-windows-setup.exe
          path: installer_output/music-cli-windows-setup.exe

      - name: Upload Windows Standalone Binary
        uses: actions/upload-artifact@v4
        with:
          name: music-Cli-windows.exe
          path: music-Cli-windows.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build macOS
        run: go build -ldflags="-s -w" -o music-Cli-macos .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-Cli-macos
          path: music-Cli-macos

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ALSA dev libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Linux
        run: go build -ldflags="-s -w" -o music-Cli-linux .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-Cli-linux
          path: music-Cli-linux

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            music-cli-windows-setup.exe/music-cli-windows-setup.exe
            music-Cli-windows.exe/music-Cli-windows.exe
            music-Cli-macos/music-Cli-macos
            music-Cli-linux/music-Cli-linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
