name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Windows
        run: go build -ldflags="-s -w" -o spotifycli-windows-amd64.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotifycli-windows-amd64.exe
          path: spotifycli-windows-amd64.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build macOS
        run: go build -ldflags="-s -w" -o spotifycli-macos .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotifycli-macos
          path: spotifycli-macos

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Linux
        run: go build -ldflags="-s -w" -o spotifycli-linux-amd64 .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotifycli-linux-amd64
          path: spotifycli-linux-amd64

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            spotifycli-windows-amd64.exe/spotifycli-windows-amd64.exe
            spotifycli-macos/spotifycli-macos
            spotifycli-linux-amd64/spotifycli-linux-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
