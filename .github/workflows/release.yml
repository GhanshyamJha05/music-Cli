name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Windows (amd64)
        run: GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o spotifycli-windows-amd64.exe .

      - name: Build macOS (Apple Silicon)
        run: GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o spotifycli-darwin-arm64 .

      - name: Build macOS (Intel)
        run: GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o spotifycli-darwin-amd64 .

      - name: Build Linux (amd64)
        run: GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o spotifycli-linux-amd64 .

      - name: Build Linux (arm64)
        run: GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o spotifycli-linux-arm64 .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            spotifycli-windows-amd64.exe
            spotifycli-darwin-arm64
            spotifycli-darwin-amd64
            spotifycli-linux-amd64
            spotifycli-linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
